<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahi's Squid Game Video Stream</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        body {
            background: #000; /* Black background */
            color: #fff; /* White text */
            font-family: 'Roboto', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: 4rem;
            margin: 20px 0;
            color: #e74c3c; /* Red text */
            text-shadow: 0 0 10px #e74c3c, 0 0 20px #e74c3c; /* Glow effect */
            animation: glow 2s infinite alternate;
        }
        @keyframes glow {
            0% {
                text-shadow: 0 0 10px #e74c3c, 0 0 20px #e74c3c;
            }
            100% {
                text-shadow: 0 0 20px #e74c3c, 0 0 40px #e74c3c;
            }
        }
        iframe {
            width: 80%;
            height: 400px;
            margin: 20px 0;
            border: none;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.5); /* Red shadow */
        }
        .episode-buttons {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .episode-buttons button {
            background-color: #e74c3c; /* Red button */
            color: #fff;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Roboto', sans-serif;
            border-radius: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .episode-buttons button:hover {
            background-color: #c0392b; /* Darker red on hover */
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.4);
        }
        .episode-buttons button:active {
            transform: translateY(0);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        .footer a {
            color: #e74c3c;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .footer a:hover {
            color: #c0392b;
        }
    </style>
</head>
<body>
    <h1>Mahi's Squid Game Video Stream 🎮</h1>
    <iframe id="videoPlayer" width="80%" height="400" frameborder="0" allowfullscreen></iframe>
    <div class="episode-buttons">
        <button onclick="changeVideo(0)">Episode 1</button>
        <button onclick="changeVideo(1)">Episode 2</button>
        <button onclick="changeVideo(2)">Episode 3</button>
        <button onclick="changeVideo(3)">Episode 4</button>
        <button onclick="changeVideo(4)">Episode 5</button>
        <button onclick="changeVideo(5)">Episode 6</button>
        <button onclick="changeVideo(6)">Episode 7</button>
    </div>
    <div class="footer">
        Made with ❤️ by <a href="#" target="_blank">robi</a>
    </div>
    <script>
        const videoLinks = [
            "https://drive.google.com/file/d/1pK9MFI9VGWtG5E9BA06YOsrAFQsaB5HT/preview",
            "https://drive.google.com/file/d/1pMWc-IihVzeyjSPJQOSKehYFLk2L-9Ny/preview",
            "https://drive.google.com/file/d/1qsh9IMOH_IhXoNHzJ6hiMUF8D0Jx-Qdg/preview",
            "https://drive.google.com/file/d/1qvs_CP83vejWKXch_JzAfow8srO0Eejq/preview",
            "https://drive.google.com/file/d/1qzUUB9-DffSCPLcH6mvr-pnrIETYBRP3/preview",
            "https://drive.google.com/file/d/1Fksnj8m1rebysqSLyWkOEMAtURWGLaPD/preview",
            "https://drive.google.com/file/d/1r04xEoNQg8mx_vZMf2tTTIWWEOYC2Ez4/preview"
        ];

        function changeVideo(index) {
            const videoPlayer = document.getElementById('videoPlayer');
            videoPlayer.src = videoLinks[index];
        }

        // Load the first video by default
        changeVideo(0);
    </script>
</body>
</html>
